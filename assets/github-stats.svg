    .label { fill: #8b949e; font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .value { fill: #58a6ff; font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #8b949e; font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
  <rect class="card" x="0.5" y="0.5" width="399" height="164" rx="10" />
  <text x="24" y="34" class="title">Panda2Chan's GitHub</text>
  
    <text x="28" y="64" class="label">Public repositories</text>
    <text x="372" y="64" class="value" text-anchor="end">14</text>
  
    <text x="28" y="88" class="label">Original repositories</text>
    <text x="372" y="88" class="value" text-anchor="end">11</text>
  
    <text x="28" y="112" class="label">Stars received</text>
    <text x="372" y="112" class="value" text-anchor="end">28</text>
  
    <text x="28" y="136" class="label">Forks received</text>
    <text x="372" y="136" class="value" text-anchor="end">4</text>
  <text x="24" y="153" class="muted">Updated 2026-08-19</text>
</svg>
